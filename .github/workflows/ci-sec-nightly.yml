name: CI - Nightly SCA SBOM

on:
  schedule:
    - cron: '55 20 * * *'
      timezone: 'America/La_Paz'
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx2g'
  TRIVY_VERSION: '0.74.0'

jobs:
  nightly-security:
    name: Nightly Security SCA
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # ---------------------------------------------------------------
      # Build + tests
      # ---------------------------------------------------------------
      - name: Build and run tests
        run: mvn -B clean verify

      - name: Create reports directory
        run: mkdir -p reports

      # ---------------------------------------------------------------
      # SAST - Semgrep
      # ---------------------------------------------------------------
      - name: Run Semgrep SAST
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config auto \
            --config /src/.semgrep.yml \
            --json \
            --output /src/reports/semgrep-lab.json \
            /src/src/main/java /src/src/main/resources

      - name: Validate Semgrep report
        run: test -s reports/semgrep-lab.json

      # ---------------------------------------------------------------
      # Static analysis - SpotBugs
      # ---------------------------------------------------------------
      - name: Run SpotBugs
        run: |
          mvn -B clean compile \
            com.github.spotbugs:spotbugs-maven-plugin:4.8.6.2:spotbugs

          test -s target/spotbugsXml.xml
          cp target/spotbugsXml.xml reports/spotbugsXml.xml

      # ---------------------------------------------------------------
      # SCA - OWASP Dependency-Check
      #
      # The scanner may return non-zero because of vulnerabilities.
      # We preserve its reports and let the custom gate parse them.
      # ---------------------------------------------------------------
      - name: Run OWASP Dependency-Check
        id: dependency_check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B org.owasp:dependency-check-maven:11.1.1:check

      - name: Collect Dependency-Check reports
        if: always()
        run: |
          test -s target/dependency-check-report.json

          cp target/dependency-check-report.json \
             reports/dependency-check-report.json

          if [ -f target/dependency-check-report.html ]; then
            cp target/dependency-check-report.html \
               reports/dependency-check-report.html
          fi

          if [ -f target/dependency-check-report.sarif ]; then
            cp target/dependency-check-report.sarif \
               reports/dependency-check-report.sarif
          fi

      # ---------------------------------------------------------------
      # SBOM - CycloneDX
      # ---------------------------------------------------------------
      - name: Generate CycloneDX SBOM
        run: |
          mvn -B \
            org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom

          test -s target/bom.json
          cp target/bom.json reports/bom.json

      # ---------------------------------------------------------------
      # SCA over the SBOM - Trivy
      #
      # First pass creates the complete JSON report without blocking.
      # ---------------------------------------------------------------
      - name: Pull Trivy
        run: |
          docker pull aquasec/trivy:${{ env.TRIVY_VERSION }}

      - name: Run full Trivy SBOM scan
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/target:/work" \
            aquasec/trivy:${{ env.TRIVY_VERSION }} \
            sbom \
            --scanners vuln \
            --format json \
            --output /work/sca-report.json \
            /work/bom.json

          test -s target/sca-report.json
          cp target/sca-report.json reports/sca-report.json

      # ---------------------------------------------------------------
      # Trivy HIGH/CRITICAL gate
      #
      # This is expected to fail while the vulnerable dependencies
      # remain. continue-on-error allows us to preserve evidence;
      # the result is enforced later.
      # ---------------------------------------------------------------
      - name: Run Trivy HIGH CRITICAL gate
        id: trivy_gate
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/target:/work" \
            aquasec/trivy:${{ env.TRIVY_VERSION }} \
            sbom \
            --scanners vuln \
            --skip-db-update \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            --output /work/sca-gate.txt \
            /work/bom.json

          test -s target/sca-gate.txt
          cp target/sca-gate.txt reports/sca-gate.txt

      # ---------------------------------------------------------------
      # Custom Quality Gate
      # Reads the real Semgrep, Dependency-Check and SpotBugs reports.
      # ---------------------------------------------------------------
      - name: Security Quality Gate
        id: security_gate
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/security_quality_gate.py \
            --semgrep reports/semgrep-lab.json \
            --dependency-check reports/dependency-check-report.json \
            --spotbugs reports/spotbugsXml.xml

      # ---------------------------------------------------------------
      # Evidence
      # Always publish reports, even when vulnerabilities are found.
      # ---------------------------------------------------------------
      - name: Upload nightly security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-security-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/semgrep-lab.json
            reports/spotbugsXml.xml
            reports/dependency-check-report.json
            reports/dependency-check-report.html
            reports/dependency-check-report.sarif
            reports/bom.json
            reports/sca-report.json
            reports/sca-gate.txt
          if-no-files-found: warn
          retention-days: 14

      # ---------------------------------------------------------------
      # Final enforcement
      # continue-on-error above is only for collecting evidence.
      # This step converts the scanner results into the final job state.
      # ---------------------------------------------------------------
      - name: Enforce security gates
        if: always()
        run: |
          echo "Custom security gate: ${{ steps.security_gate.outcome }}"
          echo "Trivy HIGH/CRITICAL gate: ${{ steps.trivy_gate.outcome }}"

          failed=0

          if [ "${{ steps.security_gate.outcome }}" != "success" ]; then
            echo "::error::Semgrep, Dependency-Check or SpotBugs Quality Gate failed."
            failed=1
          fi

          if [ "${{ steps.trivy_gate.outcome }}" != "success" ]; then
            echo "::error::Trivy found HIGH or CRITICAL vulnerabilities."
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "Nightly security pipeline FAILED."
            exit 1
          fi

          echo "Nightly security pipeline PASSED."