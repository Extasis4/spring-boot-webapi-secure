name: CI - Secure Feature

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-sec-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx2g'

jobs:
  secure-ci:
    name: Secure CI Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Create reports directory
        run: mkdir -p reports

      # ---------------------------------------------------------------
      # SAST - Semgrep
      # Generates the report first; the Quality Gate decides whether
      # the findings block the pipeline.
      # ---------------------------------------------------------------
      - name: Run Semgrep SAST
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config auto \
            --config /src/.semgrep.yml \
            --json \
            --output /src/reports/semgrep-lab.json \
            /src/src/main/java /src/src/main/resources

      - name: Validate Semgrep report
        run: test -s reports/semgrep-lab.json

      # ---------------------------------------------------------------
      # Static analysis - SpotBugs
      # ---------------------------------------------------------------
      - name: Run SpotBugs
        run: |
          mvn -B clean compile \
            com.github.spotbugs:spotbugs-maven-plugin:4.8.6.2:spotbugs

          test -s target/spotbugsXml.xml
          cp target/spotbugsXml.xml reports/spotbugsXml.xml

      # ---------------------------------------------------------------
      # SCA - OWASP Dependency-Check
      #
      # Dependency-Check is allowed to return non-zero after creating
      # its reports. The final Quality Gate parses the JSON and is the
      # authoritative blocking control.
      # ---------------------------------------------------------------
      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-
      - name: Run OWASP Dependency-Check
        id: dependency_check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B org.owasp:dependency-check-maven:11.1.1:check

      - name: Collect Dependency-Check reports
        if: always()
        run: |
          test -s target/dependency-check-report.json

          cp target/dependency-check-report.json \
             reports/dependency-check-report.json

          if [ -f target/dependency-check-report.html ]; then
            cp target/dependency-check-report.html \
               reports/dependency-check-report.html
          fi

          if [ -f target/dependency-check-report.sarif ]; then
            cp target/dependency-check-report.sarif \
               reports/dependency-check-report.sarif
          fi

      # ---------------------------------------------------------------
      # Improved Quality Gate
      # Reads the actual reports generated by the scanners.
      # ---------------------------------------------------------------
      - name: Security Quality Gate
        if: always()
        run: |
          python3 scripts/security_quality_gate.py \
            --semgrep reports/semgrep-lab.json \
            --dependency-check reports/dependency-check-report.json \
            --spotbugs reports/spotbugsXml.xml

      # Evidence is uploaded even when the Quality Gate fails.
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-ci-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/semgrep-lab.json
            reports/spotbugsXml.xml
            reports/dependency-check-report.json
            reports/dependency-check-report.html
            reports/dependency-check-report.sarif
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  # -----------------------------------------------------------------
  # Additional SAST - CodeQL
  # Semgrep feeds our custom Quality Gate; CodeQL remains as an
  # additional independent security analysis.
  # -----------------------------------------------------------------
  codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"