name: CI-CD - Secure Main Develop

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-sec-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx2g'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  secure-ci:
    name: Secure CI Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Create reports directory
        run: mkdir -p reports

      # ---------------------------------------------------------------
      # SAST - Semgrep
      # ---------------------------------------------------------------
      - name: Run Semgrep SAST
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config auto \
            --config /src/.semgrep.yml \
            --json \
            --output /src/reports/semgrep-lab.json \
            /src/src/main/java /src/src/main/resources

      - name: Validate Semgrep report
        run: test -s reports/semgrep-lab.json

      # ---------------------------------------------------------------
      # Static analysis - SpotBugs
      # ---------------------------------------------------------------
      - name: Run SpotBugs
        run: |
          mvn -B clean compile \
            com.github.spotbugs:spotbugs-maven-plugin:4.8.6.2:spotbugs

          test -s target/spotbugsXml.xml
          cp target/spotbugsXml.xml reports/spotbugsXml.xml

      # ---------------------------------------------------------------
      # SCA - OWASP Dependency-Check
      # Generates the reports even when vulnerabilities exceed CVSS 7.
      # The custom Quality Gate performs the final blocking decision.
      # ---------------------------------------------------------------
      - name: Run OWASP Dependency-Check
        id: dependency_check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B org.owasp:dependency-check-maven:11.1.1:check

      - name: Collect Dependency-Check reports
        if: always()
        run: |
          test -s target/dependency-check-report.json

          cp target/dependency-check-report.json \
             reports/dependency-check-report.json

          if [ -f target/dependency-check-report.html ]; then
            cp target/dependency-check-report.html \
               reports/dependency-check-report.html
          fi

          if [ -f target/dependency-check-report.sarif ]; then
            cp target/dependency-check-report.sarif \
               reports/dependency-check-report.sarif
          fi

      # ---------------------------------------------------------------
      # Improved Quality Gate
      # ---------------------------------------------------------------
      - name: Security Quality Gate
        if: always()
        run: |
          python3 scripts/security_quality_gate.py \
            --semgrep reports/semgrep-lab.json \
            --dependency-check reports/dependency-check-report.json \
            --spotbugs reports/spotbugsXml.xml

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-ci-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/semgrep-lab.json
            reports/spotbugsXml.xml
            reports/dependency-check-report.json
            reports/dependency-check-report.html
            reports/dependency-check-report.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  # -----------------------------------------------------------------
  # Additional SAST - CodeQL
  # -----------------------------------------------------------------
  codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

  # -----------------------------------------------------------------
  # CD - Build, scan and publish container
  #
  # This job cannot execute unless the secure CI and CodeQL jobs pass.
  # Container publication occurs only on a push to main.
  # -----------------------------------------------------------------
  docker-build-scan-push:
    name: Docker Build Scan Push
    runs-on: ubuntu-latest
    needs:
      - secure-ci
      - codeql

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-container

      - name: Push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}