name: Security - Semgrep Manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --config .semgrep.yml \
            --json-output=semgrep-results.json \
            --sarif-output=semgrep-results.sarif \
            src/main/java \
            src/main/resources

      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-manual-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            semgrep-results.json
            semgrep-results.sarif
          if-no-files-found: warn
          retention-days: 14