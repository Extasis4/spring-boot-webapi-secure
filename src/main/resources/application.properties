spring.application.name=springboot-devsecops-lab

spring.datasource.url=jdbc:h2:mem:devsecopsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false

spring.sql.init.mode=always

# Configuracion endurecida para el laboratorio DevSecOps.
management.endpoints.web.exposure.include=health,info
management.endpoint.env.show-values=never
server.error.include-message=never
server.error.include-stacktrace=never

# Los secretos se obtienen del entorno.
lab.admin.password=${LAB_ADMIN_PASSWORD:change-me}
lab.jwt.secret=${LAB_JWT_SECRET:change-me}
lab.external.api-key=${LAB_EXTERNAL_API_KEY:not-configured}